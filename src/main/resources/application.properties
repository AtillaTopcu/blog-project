# ============================================================
# APPLICATION
# ============================================================

server.port=5555
spring.application.name=Ecodation_2026_FullStack_SpringReact


# ============================================================
# SPRING
# ============================================================

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

server.error.whitelabel.enabled=false

spring.jackson.mapper.default-view-inclusion=true


# ============================================================
# API / PAGINATION
# ============================================================

api.result.error=General Exception
api.result.message=Rest Global Exception Handler

spring.data.web.pageable.page-parameter=currentPage
spring.data.web.pageable.size-parameter=pageSize
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=1000


# ============================================================
# MAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ============================================================
# LOGGING
# ============================================================

logging.file.name=./log/blog.log

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR


# ============================================================
# SECURITY
# ============================================================

spring.security.superadmin.email=${SUPERADMIN_EMAIL}
spring.security.superadmin.password=${SUPERADMIN_PASSWORD}
spring.security.superadmin.roles=SUPERADMIN
spring.security.superadmin.nickname=${SUPERADMIN_NICKNAME}
spring.security.superadmin.name=${SUPERADMIN_NAME}
spring.security.superadmin.surname=${SUPERADMIN_SURNAME}

spring.security.user.name=${BASIC_AUTH_USERNAME}
spring.security.user.password=${BASIC_AUTH_PASSWORD}


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expire=PT1H

security.jwt.secret=${app.jwt.secret}
security.jwt.expire-ms=3600000


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

file.upload-dir=upload
file.base-url=http://localhost:5555


# ============================================================
# SESSION
# ============================================================

server.servlet.session.timeout=30m


# ============================================================
# ACTUATOR / MONITORING
# ============================================================

springdoc.show-actuator=true

management.server.port=5555
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

info.app.name=Java Full Stack Developer
info.app.description=Java Spring Boot Full Stack Blog Application
info.app.version=1.0.0


# ============================================================
# REDIS
# ============================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

spring.cache.type=redis


# ============================================================
# CONTENT NEGOTIATION
# ============================================================

spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.default-content-type=application/json


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.jpa.properties.hibernate.generate_statistics=true

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop

logging.level.org.springframework.jdbc.core=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.cache=TRACE


# ============================================================
# H2 DATABASE
# ============================================================

spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.url=jdbc:h2:file:./database_memory_persist/blog
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# ============================================================
# PROFILE
# ============================================================

# Development:
# spring.profiles.active=dev

# Production:
# spring.profiles.active=prod

# Test:
# spring.profiles.active=test


